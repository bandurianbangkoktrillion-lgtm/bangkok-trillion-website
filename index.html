<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Bangkok Trillion | Company Profile</title>

    <meta
        name="description"
        content="Bangkok Trillion Company Limited — AI Smart Fresh Market"
    >

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at center,
                    #f8faf7 0%,
                    #e9eee9 55%,
                    #dfe6df 100%
                );

            font-family:
                Arial,
                "Noto Sans Thai",
                "Tahoma",
                sans-serif;

            overflow: hidden;

            color: #123b25;

            -webkit-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
           MAIN APP
        ========================================================= */

        .app {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            overflow: hidden;
        }


        /* =========================================================
           BOOK AREA
        ========================================================= */

        .book-container {

            position: relative;

            width: min(
                92vw,
                calc(100vh * 210 / 297 * 0.96)
            );

            height: min(
                96vh,
                calc(92vw * 297 / 210)
            );

            aspect-ratio: 210 / 297;

            perspective: 2500px;
        }


        /* =========================================================
           BOOK
        ========================================================= */

        .book {

            width: 100%;
            height: 100%;

            position: relative;

            transform-style: preserve-3d;

            filter:
                drop-shadow(
                    0 18px 35px rgba(0,0,0,0.25)
                );

            border-radius: 3px;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #ffffff;

            overflow: hidden;

            transform-origin: left center;

            transform-style: preserve-3d;

            backface-visibility: hidden;

            transition:
                transform 0.85s cubic-bezier(
                    0.65,
                    0,
                    0.35,
                    1
                ),
                opacity 0.25s ease;

            box-shadow:
                inset 0 0 0 1px rgba(0,0,0,0.05);

            border-radius: 2px;
        }


        .page img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            pointer-events: none;
        }


        /* =========================================================
           PAGE STATES
        ========================================================= */

        .page.previous {

            transform:
                rotateY(-180deg);

            opacity: 0;

            pointer-events: none;

            z-index: 1;
        }


        .page.current {

            transform:
                rotateY(0deg);

            opacity: 1;

            pointer-events: auto;

            z-index: 10;
        }


        .page.next {

            transform:
                rotateY(0deg);

            opacity: 0;

            pointer-events: none;

            z-index: 1;
        }


        /* =========================================================
           SHADOW DURING PAGE TURN
        ========================================================= */

        .page::after {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.18),
                    transparent 35%,
                    transparent 70%,
                    rgba(0,0,0,0.08)
                );

            opacity: 0;

            transition:
                opacity 0.5s ease;
        }


        .page.turning::after {
            opacity: 1;
        }


        /* =========================================================
           TOP BRAND BAR
        ========================================================= */

        .top-brand {

            position: fixed;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 100;

            padding: 7px 16px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.88);

            backdrop-filter:
                blur(10px);

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);

            color: #145b31;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 1px;

            white-space: nowrap;
        }


        /* =========================================================
           PAGE COUNTER
        ========================================================= */

        .page-counter {

            position: fixed;

            bottom: 24px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 100;

            min-width: 82px;

            text-align: center;

            padding: 7px 14px;

            border-radius: 25px;

            background:
                rgba(0,0,0,0.62);

            color: white;

            font-size: 13px;

            font-weight: 600;

            backdrop-filter:
                blur(8px);
        }


        /* =========================================================
           NAVIGATION BUTTONS
        ========================================================= */

        .nav-button {

            position: fixed;

            top: 50%;

            transform: translateY(-50%);

            z-index: 100;

            width: 48px;
            height: 48px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.9);

            color: #145b31;

            font-size: 26px;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.18);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }


        .nav-button:hover {

            background: #ffffff;

            transform:
                translateY(-50%)
                scale(1.08);
        }


        .nav-button:active {

            transform:
                translateY(-50%)
                scale(0.94);
        }


        .previous-button {
            left: 18px;
        }


        .next-button {
            right: 18px;
        }


        /* =========================================================
           START HINT
        ========================================================= */

        .swipe-hint {

            position: fixed;

            left: 50%;

            bottom: 58px;

            transform: translateX(-50%);

            z-index: 90;

            color: rgba(0,0,0,0.55);

            font-size: 12px;

            pointer-events: none;

            animation:
                fadeHint 4s ease forwards;
        }


        @keyframes fadeHint {

            0% {
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            75% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {

            position: fixed;

            inset: 0;

            z-index: 200;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #f7faf6,
                    #e7efe7
                );

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }


        .loading.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .loading-content {

            text-align: center;

            color: #145b31;
        }


        .loading-logo {

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 8px;
        }


        .loading-text {

            font-size: 14px;

            opacity: 0.75;
        }


        .spinner {

            width: 35px;
            height: 35px;

            border-radius: 50%;

            border: 3px solid rgba(20,91,49,0.15);

            border-top-color: #145b31;

            animation:
                spin 0.8s linear infinite;

            margin:
                18px auto 0;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            body {

                background: #111;

            }


            .app {

                background: #111;

            }


            .book-container {

                width: 100vw;

                height: 100vh;

                max-width: none;

                max-height: none;

                display: flex;

                align-items: center;

                justify-content: center;

                aspect-ratio: auto;
            }


            .book {

                width: min(
                    100vw,
                    calc(100vh * 210 / 297)
                );

                height: min(
                    100vh,
                    calc(100vw * 297 / 210)
                );

                aspect-ratio: 210 / 297;

                filter:
                    drop-shadow(
                        0 8px 20px rgba(0,0,0,0.35)
                    );
            }


            .top-brand {

                top: 8px;

                font-size: 10px;

                padding:
                    5px 10px;

                letter-spacing:
                    0.6px;
            }


            .nav-button {

                width: 40px;
                height: 40px;

                font-size: 22px;

                background:
                    rgba(255,255,255,0.82);
            }


            .previous-button {

                left: 7px;
            }


            .next-button {

                right: 7px;
            }


            .page-counter {

                bottom: 8px;

                font-size: 11px;

                padding:
                    5px 11px;
            }


            .swipe-hint {

                bottom: 38px;

                font-size: 10px;
            }

        }


        /* =========================================================
           VERY SMALL MOBILE
        ========================================================= */

        @media (max-width: 380px) {

            .nav-button {

                width: 34px;
                height: 34px;

                font-size: 18px;
            }


            .previous-button {

                left: 4px;
            }


            .next-button {

                right: 4px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================================
         LOADING SCREEN
    ========================================================= -->

    <div
        class="loading"
        id="loading"
    >

        <div class="loading-content">

            <div class="loading-logo">
                BANGKOK TRILLION
            </div>

            <div class="loading-text">
                AI SMART FRESH MARKET
            </div>

            <div class="spinner"></div>

        </div>

    </div>


    <!-- =========================================================
         BRAND
    ========================================================= -->

    <div class="top-brand">
        BANGKOK TRILLION • COMPANY PROFILE
    </div>


    <!-- =========================================================
         BOOK
    ========================================================= -->

    <main class="app">

        <div class="book-container">

            <div
                class="book"
                id="book"
            >


                <!-- PAGE 1 -->

                <div
                    class="page current"
                    data-page="1"
                >

                    <img
                        src="page01.png"
                        alt="Bangkok Trillion - Cover"
                    >

                </div>


                <!-- PAGE 2 -->

                <div
                    class="page next"
                    data-page="2"
                >

                    <img
                        src="page02.png"
                        alt="Bangkok Trillion - About Us"
                    >

                </div>


                <!-- PAGE 3 -->

                <div
                    class="page next"
                    data-page="3"
                >

                    <img
                        src="page03.png"
                        alt="Bangkok Trillion - Our Journey"
                    >

                </div>


                <!-- PAGE 4 -->

                <div
                    class="page next"
                    data-page="4"
                >

                    <img
                        src="page04.png"
                        alt="Bangkok Trillion - Our Expertise"
                    >

                </div>


                <!-- PAGE 5 -->

                <div
                    class="page next"
                    data-page="5"
                >

                    <img
                        src="page05.png"
                        alt="Bangkok Trillion - Our Innovation"
                    >

                </div>


                <!-- PAGE 6 -->

                <div
                    class="page next"
                    data-page="6"
                >

                    <img
                        src="page06.png"
                        alt="Bangkok Trillion - AI Smart Cooler"
                    >

                </div>


                <!-- PAGE 7 -->

                <div
                    class="page next"
                    data-page="7"
                >

                    <img
                        src="page07.png"
                        alt="Bangkok Trillion - AI Smart Fresh Market"
                    >

                </div>


                <!-- PAGE 8 -->

                <div
                    class="page next"
                    data-page="8"
                >

                    <img
                        src="page08.png"
                        alt="Bangkok Trillion - Why Condominium"
                    >

                </div>


                <!-- PAGE 9 -->

                <div
                    class="page next"
                    data-page="9"
                >

                    <img
                        src="page11.png"
                        alt="Bangkok Trillion - AI Smart Cooler"
                    >

                </div>


                <!-- PAGE 10 -->

                <div
                    class="page next"
                    data-page="10"
                >

                    <img

            </div>

        </div>

    </main>


    <!-- =========================================================
         NAVIGATION
    ========================================================= -->

    <button
        class="nav-button previous-button"
        id="previousButton"
        aria-label="Previous page"
    >
        ‹
    </button>


    <button
        class="nav-button next-button"
        id="nextButton"
        aria-label="Next page"
    >
        ›
    </button>


    <!-- =========================================================
         SWIPE HINT
    ========================================================= -->

    <div
        class="swipe-hint"
        id="swipeHint"
    >
        ← ปัดซ้าย / ขวา เพื่อเปิดหน้า →
    </div>


    <!-- =========================================================
         PAGE COUNTER
    ========================================================= -->

    <div
        class="page-counter"
        id="pageCounter"
    >
        PAGE 1 / 10
    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        /* =========================================================
           PAGE DATA
        ========================================================= */

        const pages = [
            "page01.png",
            "page02.png",
            "page03.png",
            "page04.png",
            "page05.png",
            "page06.png",
            "page07.png",
            "page08.png",
            "page11.png",
            "page12.png"
        ];


        /* =========================================================
           VARIABLES
        ========================================================= */

        let currentPage = 0;

        let isAnimating = false;

        const pageElements =
            document.querySelectorAll(".page");

        const nextButton =
            document.getElementById("nextButton");

        const previousButton =
            document.getElementById("previousButton");

        const pageCounter =
            document.getElementById("pageCounter");

        const swipeHint =
            document.getElementById("swipeHint");

        const loading =
            document.getElementById("loading");


        /* =========================================================
           UPDATE PAGE
        ========================================================= */

        function updatePage(
            newPage,
            direction
        ) {

            if (
                isAnimating ||
                newPage < 0 ||
                newPage >= pages.length ||
                newPage === currentPage
            ) {

                return;

            }


            isAnimating = true;


            const oldPage =
                pageElements[currentPage];

            const targetPage =
                pageElements[newPage];


            /* ---------------------------------------------
               Remove old states
            --------------------------------------------- */

            pageElements.forEach(
                page => {

                    page.classList.remove(
                        "current",
                        "previous",
                        "next",
                        "turning"
                    );

                }
            );


            /* ---------------------------------------------
               Forward
            --------------------------------------------- */

            if (direction === "next") {

                oldPage.classList.add(
                    "previous"
                );

                targetPage.classList.add(
                    "current"
                );

            }


            /* ---------------------------------------------
               Backward
            --------------------------------------------- */

            else {

                oldPage.classList.add(
                    "next"
                );

                targetPage.classList.add(
                    "current"
                );

            }


            /* ---------------------------------------------
               Add turning effect
            --------------------------------------------- */

            oldPage.classList.add(
                "turning"
            );


            currentPage = newPage;


            /* ---------------------------------------------
               Counter
            --------------------------------------------- */

            pageCounter.textContent =
                `PAGE ${currentPage + 1} / ${pages.length}`;


            /* ---------------------------------------------
               Animation unlock
            --------------------------------------------- */

            setTimeout(
                () => {

                    isAnimating = false;

                    oldPage.classList.remove(
                        "turning"
                    );

                },
                850
            );

        }


        /* =========================================================
           NEXT PAGE
        ========================================================= */

        function nextPage() {

            if (
                currentPage <
                pages.length - 1
            ) {

                updatePage(
                    currentPage + 1,
                    "next"
                );

            }

        }


        /* =========================================================
           PREVIOUS PAGE
        ========================================================= */

        function previousPage() {

            if (
                currentPage > 0
            ) {

                updatePage(
                    currentPage - 1,
                    "previous"
                );

            }

        }


        /* =========================================================
           BUTTON EVENTS
        ========================================================= */

        nextButton.addEventListener(
            "click",
            nextPage
        );


        previousButton.addEventListener(
            "click",
            previousPage
        );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowRight" ||
                    event.key === "ArrowDown" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    nextPage();

                }


                if (
                    event.key === "ArrowLeft" ||
                    event.key === "ArrowUp"
                ) {

                    event.preventDefault();

                    previousPage();

                }

            }
        );


        /* =========================================================
           TOUCH / SWIPE
        ========================================================= */

        let touchStartX = 0;

        let touchStartY = 0;

        let touchEndX = 0;

        let touchEndY = 0;


        const book =
            document.getElementById("book");


        book.addEventListener(
            "touchstart",
            event => {

                const touch =
                    event.changedTouches[0];

                touchStartX =
                    touch.screenX;

                touchStartY =
                    touch.screenY;

            },
            {
                passive: true
            }
        );


        book.addEventListener(
            "touchend",
            event => {

                const touch =
                    event.changedTouches[0];

                touchEndX =
                    touch.screenX;

                touchEndY =
                    touch.screenY;


                handleSwipe();

            },
            {
                passive: true
            }
        );


        function handleSwipe() {

            const deltaX =
                touchEndX - touchStartX;

            const deltaY =
                touchEndY - touchStartY;


            /* ---------------------------------------------
               Ignore vertical scrolling gestures
            --------------------------------------------- */

            if (
                Math.abs(deltaX) <
                Math.abs(deltaY)
            ) {

                return;

            }


            /* ---------------------------------------------
               Swipe threshold
            --------------------------------------------- */

            if (
                Math.abs(deltaX) < 45
            ) {

                return;

            }


            /* ---------------------------------------------
               Swipe left = next
               Swipe right = previous
            --------------------------------------------- */

            if (
                deltaX < 0
            ) {

                nextPage();

            }

            else {

                previousPage();

            }

        }


        /* =========================================================
           MOUSE DRAG
        ========================================================= */

        let mouseStartX = 0;

        let mouseDown = false;


        book.addEventListener(
            "mousedown",
            event => {

                mouseDown = true;

                mouseStartX =
                    event.clientX;

            }
        );


        document.addEventListener(
            "mouseup",
            event => {

                if (!mouseDown) {

                    return;

                }


                mouseDown = false;


                const deltaX =
                    event.clientX -
                    mouseStartX;


                if (
                    Math.abs(deltaX) < 50
                ) {

                    return;

                }


                if (
                    deltaX < 0
                ) {

                    nextPage();

                }

                else {

                    previousPage();

                }

            }
        );


        /* =========================================================
           PRELOAD ALL IMAGES
        ========================================================= */

        function preloadImages() {

            let loaded = 0;


            pages.forEach(
                src => {

                    const image =
                        new Image();


                    image.onload =
                        image.onerror =
                        () => {

                            loaded++;


                            if (
                                loaded ===
                                pages.length
                            ) {

                                finishLoading();

                            }

                        };


                    image.src = src;

                }
            );

        }


        /* =========================================================
           FINISH LOADING
        ========================================================= */

        function finishLoading() {

            setTimeout(
                () => {

                    loading.classList.add(
                        "hidden"
                    );

                },
                400
            );

        }


        /* =========================================================
           START
        ========================================================= */

        preloadImages();


        /* =========================================================
           HIDE SWIPE HINT AFTER FIRST INTERACTION
        ========================================================= */

        function hideSwipeHint() {

            swipeHint.style.display =
                "none";

        }


        nextButton.addEventListener(
            "click",
            hideSwipeHint
        );


        previousButton.addEventListener(
            "click",
            hideSwipeHint
        );


        book.addEventListener(
            "touchstart",
            hideSwipeHint,
            {
                once: true,
                passive: true
            }
        );


    </script>

</body>
</html>
