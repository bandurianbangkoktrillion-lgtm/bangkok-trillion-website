<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Bangkok Trillion | Company Profile</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #111;
}

/* =====================================================
   MAIN BOOK VIEW
===================================================== */

#book {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    background:
        radial-gradient(circle at center,
        #3a3a3a 0%,
        #191919 55%,
        #0d0d0d 100%);
}

/* Page */

#page {
    height: 94vh;
    max-width: 95vw;

    display: block;

    object-fit: contain;

    cursor: zoom-in;

    box-shadow:
        0 10px 40px rgba(0,0,0,.55);

    transition:
        transform .25s ease,
        opacity .25s ease;
}

/* =====================================================
   TOP TITLE
===================================================== */

.top-title {

    position: absolute;

    top: 14px;
    left: 50%;

    transform: translateX(-50%);

    padding: 9px 28px;

    border-radius: 30px;

    background: rgba(255,255,255,.94);

    color: #145c32;

    font-size: 17px;
    font-weight: bold;

    letter-spacing: 1px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.25);

    z-index: 10;
}

/* =====================================================
   PAGE COUNTER
===================================================== */

#counter {

    position: absolute;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,.72);

    color: white;

    padding: 8px 18px;

    border-radius: 22px;

    font-size: 15px;

    z-index: 10;
}

/* =====================================================
   NAVIGATION BUTTONS
===================================================== */

.nav {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.85);

    color: #176b3b;

    font-size: 38px;

    cursor: pointer;

    z-index: 20;

    box-shadow:
        0 4px 15px rgba(0,0,0,.25);

    transition: .2s;
}

.nav:hover {
    background: white;
    transform:
        translateY(-50%)
        scale(1.08);
}

#prev {
    left: 18px;
}

#next {
    right: 18px;
}

/* =====================================================
   READING MODE
===================================================== */

#reader {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.96);

    z-index: 1000;

    overflow: hidden;

    touch-action: none;
}

/* Reader image */

#readerImage {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(1);

    transform-origin: center center;

    max-width: none;
    max-height: none;

    user-select: none;
    -webkit-user-select: none;

    pointer-events: none;
}

/* =====================================================
   READER CONTROLS
===================================================== */

.readerTop {

    position: fixed;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 1100;
}

.readerButton {

    border: none;

    background: rgba(255,255,255,.92);

    color: #145c32;

    font-size: 18px;

    min-width: 42px;
    height: 42px;

    border-radius: 22px;

    cursor: pointer;

    box-shadow:
        0 3px 12px rgba(0,0,0,.3);
}

.readerButton:hover {
    background: white;
}

/* Close */

#closeReader {

    position: fixed;

    top: 15px;
    right: 18px;

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.92);

    color: #145c32;

    font-size: 25px;

    cursor: pointer;

    z-index: 1100;
}

/* Reader counter */

#readerCounter {

    position: fixed;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    padding: 8px 18px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);

    color: white;

    z-index: 1100;

    font-size: 14px;
}

/* Reader navigation */

.readerNav {

    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    width: 55px;
    height: 55px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.85);

    color: #145c32;

    font-size: 35px;

    z-index: 1100;

    cursor: pointer;
}

#readerPrev {
    left: 18px;
}

#readerNext {
    right: 18px;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .top-title {

        top: 8px;

        font-size: 12px;

        padding: 7px 15px;

        white-space: nowrap;
    }

    #page {

        width: 96vw;
        height: auto;
        max-height: 92vh;
    }

    .nav {

        width: 44px;
        height: 44px;

        font-size: 28px;
    }

    #prev {
        left: 8px;
    }

    #next {
        right: 8px;
    }

    #counter {

        bottom: 10px;

        font-size: 12px;

        padding: 6px 13px;
    }

    .readerButton {

        min-width: 38px;
        height: 38px;

        font-size: 16px;
    }

    #closeReader {

        width: 40px;
        height: 40px;

        top: 10px;
        right: 10px;
    }

    .readerNav {

        width: 44px;
        height: 44px;

        font-size: 28px;
    }

    #readerPrev {
        left: 7px;
    }

    #readerNext {
        right: 7px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BOOK VIEW
===================================================== -->

<div id="book">

    <div class="top-title">
        BANGKOK TRILLION • COMPANY PROFILE
    </div>

    <button
        class="nav"
        id="prev"
        aria-label="Previous page">
        ‹
    </button>

    <img
        id="page"
        src="page01.png"
        alt="Bangkok Trillion Company Profile">

    <button
        class="nav"
        id="next"
        aria-label="Next page">
        ›
    </button>

    <div id="counter">
        PAGE 1 / 10
    </div>

</div>


<!-- =====================================================
     READING MODE
===================================================== -->

<div id="reader">

    <div class="readerTop">

        <button
            class="readerButton"
            id="zoomOut">
            −
        </button>

        <button
            class="readerButton"
            id="zoomReset">
            100%
        </button>

        <button
            class="readerButton"
            id="zoomIn">
            +
        </button>

    </div>


    <button
        id="closeReader"
        aria-label="Close">
        ×
    </button>


    <button
        class="readerNav"
        id="readerPrev">
        ‹
    </button>


    <img
        id="readerImage"
        src="page01.png"
        alt="Company Profile page">


    <button
        class="readerNav"
        id="readerNext">
        ›
    </button>


    <div id="readerCounter">
        PAGE 1 / 10
    </div>

</div>


<script>

/* =====================================================
   PAGE DATA
===================================================== */

const pages = [

    "page01.png",
    "page02.png",
    "page03.png",
    "page04.png",
    "page05.png",
    "page06.png",
    "page07.png",
    "page08.png",

    "page11.png",
    "page12.png"

];


/* =====================================================
   VARIABLES
===================================================== */

let currentPage = 0;

const page =
    document.getElementById("page");

const counter =
    document.getElementById("counter");

const reader =
    document.getElementById("reader");

const readerImage =
    document.getElementById("readerImage");

const readerCounter =
    document.getElementById("readerCounter");


/* =====================================================
   UPDATE PAGE
===================================================== */

function updatePage() {

    const file =
        pages[currentPage];

    page.src = file;

    counter.textContent =
        `PAGE ${currentPage + 1} / ${pages.length}`;

    readerImage.src = file;

    readerCounter.textContent =
        `PAGE ${currentPage + 1} / ${pages.length}`;

}


/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage() {

    if (currentPage < pages.length - 1) {

        currentPage++;

        updatePage();

    }

}


/* =====================================================
   PREVIOUS PAGE
===================================================== */

function previousPage() {

    if (currentPage > 0) {

        currentPage--;

        updatePage();

    }

}


/* =====================================================
   BUTTONS
===================================================== */

document
    .getElementById("next")
    .onclick = nextPage;

document
    .getElementById("prev")
    .onclick = previousPage;

document
    .getElementById("readerNext")
    .onclick = nextPage;

document
    .getElementById("readerPrev")
    .onclick = previousPage;


/* =====================================================
   OPEN READER
===================================================== */

page.onclick = function () {

    reader.style.display = "block";

    resetZoom();

};


/* =====================================================
   CLOSE READER
===================================================== */

document
    .getElementById("closeReader")
    .onclick = function () {

        reader.style.display = "none";

    };


/* =====================================================
   ZOOM SYSTEM
===================================================== */

let scale = 1;

let posX = 0;
let posY = 0;

function applyTransform() {

    readerImage.style.transform =
        `translate(calc(-50% + ${posX}px),
                   calc(-50% + ${posY}px))
         scale(${scale})`;

}


function resetZoom() {

    scale = 1;

    posX = 0;
    posY = 0;

    readerImage.onload = function () {

        fitReaderImage();

    };

    if (readerImage.complete) {

        fitReaderImage();

    }

}


function fitReaderImage() {

    const vw =
        window.innerWidth;

    const vh =
        window.innerHeight;

    const iw =
        readerImage.naturalWidth;

    const ih =
        readerImage.naturalHeight;

    if (!iw || !ih) return;

    const fit =
        Math.min(
            vw / iw,
            vh / ih
        );

    readerImage.style.width =
        iw + "px";

    readerImage.style.height =
        ih + "px";

    scale = fit;

    posX = 0;
    posY = 0;

    applyTransform();

}


function zoomIn() {

    scale *= 1.25;

    if (scale > 6)
        scale = 6;

    applyTransform();

}


function zoomOut() {

    scale /= 1.25;

    if (scale < 0.3)
        scale = 0.3;

    applyTransform();

}


document
    .getElementById("zoomIn")
    .onclick = zoomIn;

document
    .getElementById("zoomOut")
    .onclick = zoomOut;

document
    .getElementById("zoomReset")
    .onclick = resetZoom;


/* =====================================================
   MOUSE WHEEL ZOOM
===================================================== */

reader.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();

        if (e.deltaY < 0)
            zoomIn();

        else
            zoomOut();

    },
    { passive: false }
);


/* =====================================================
   DRAG / PAN
===================================================== */

let dragging = false;

let startX = 0;
let startY = 0;

reader.addEventListener(
    "pointerdown",
    function(e) {

        if (e.pointerType === "touch")
            return;

        dragging = true;

        startX = e.clientX - posX;
        startY = e.clientY - posY;

    }
);


reader.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging)
            return;

        posX =
            e.clientX - startX;

        posY =
            e.clientY - startY;

        applyTransform();

    }
);


reader.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


/* =====================================================
   TOUCH PINCH ZOOM
===================================================== */

let touches = [];

let initialDistance = 0;

let initialScale = 1;


reader.addEventListener(
    "touchstart",
    function(e) {

        touches =
            Array.from(e.touches);

        if (touches.length === 2) {

            initialDistance =
                distance(
                    touches[0],
                    touches[1]
                );

            initialScale =
                scale;

        }

    },
    { passive: false }
);


reader.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

        const currentTouches =
            Array.from(e.touches);

        if (currentTouches.length === 2) {

            const currentDistance =
                distance(
                    currentTouches[0],
                    currentTouches[1]
                );

            if (initialDistance > 0) {

                scale =
                    initialScale *
                    (currentDistance /
                     initialDistance);

                if (scale < 0.3)
                    scale = 0.3;

                if (scale > 6)
                    scale = 6;

                applyTransform();

            }

        }

    },
    { passive: false }
);


function distance(a, b) {

    const dx =
        a.clientX - b.clientX;

    const dy =
        a.clientY - b.clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "ArrowRight")
            nextPage();

        if (e.key === "ArrowLeft")
            previousPage();

        if (e.key === "Escape")
            reader.style.display = "none";

        if (
            e.key === "+" ||
            e.key === "="
        )
            zoomIn();

        if (e.key === "-")
            zoomOut();

    }
);


/* =====================================================
   SWIPE PAGE
===================================================== */

let swipeStartX = 0;

document.addEventListener(
    "touchstart",
    function(e) {

        if (
            reader.style.display === "block"
        )
            return;

        swipeStartX =
            e.changedTouches[0].screenX;

    },
    { passive: true }
);


document.addEventListener(
    "touchend",
    function(e) {

        if (
            reader.style.display === "block"
        )
            return;

        const endX =
            e.changedTouches[0].screenX;

        const difference =
            endX - swipeStartX;

        if (Math.abs(difference) < 60)
            return;

        if (difference < 0)
            nextPage();

        else
            previousPage();

    },
    { passive: true }
);


/* =====================================================
   INITIALIZE
===================================================== */

updatePage();

</script>

</body>
</html>
